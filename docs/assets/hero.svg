    <path d="M103 107h23c23 0 37 13 37 34s-14 34-37 34h-23zm22 49c11 0 17-5 17-15s-6-15-17-15h-2v30z" fill="#062038"/>
  </g>
  <text x="222" y="135" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="58" font-weight="700">CDPA-LLMs</text>
  <text x="222" y="181" fill="#99f6e4" font-family="Segoe UI,Arial,sans-serif" font-size="24" letter-spacing="1">DECISION-PREFERENCE ASSESSMENT</text>
  <text x="74" y="258" fill="#e2e8f0" font-family="Segoe UI,Arial,sans-serif" font-size="28">可复现的模型调用 · 严格的排序解析 · 可审计的描述性报告</text>
