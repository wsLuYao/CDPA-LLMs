<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">CDPA-LLMs</title>
  <desc id="desc">Transparent decision-preference assessment for language models</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a2e"/>
      <stop offset="0.55" stop-color="#12385b"/>
      <stop offset="1" stop-color="#0d6b70"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#5eead4"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#00101c" flood-opacity=".4"/>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="30" fill="url(#bg)"/>
  <circle cx="1085" cy="65" r="190" fill="#38bdf8" opacity=".09"/>
  <circle cx="1030" cy="390" r="250" fill="#2dd4bf" opacity=".08"/>
  <g filter="url(#shadow)">
