    <rect x="186" width="138" height="38" rx="19" fill="#123f53" stroke="#7dd3fc" stroke-opacity=".45"/><text x="214" y="25" fill="#e0f2fe">SELF-HOSTED</text>
    <rect x="340" width="160" height="38" rx="19" fill="#123f53" stroke="#c4b5fd" stroke-opacity=".45"/><text x="366" y="25" fill="#ede9fe">PRIVACY-FIRST</text>
